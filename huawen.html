<style>
	@font-face {
		font-family: "NotoSerifCJKtc";

		font-weight: normal;
		font-style: normal;
	}
	body { font-family: NotoSerifCJKtc, serif; margin: 20px; }

  #container {
    position: relative;
    width: 100%;
  }
	#ime-input {
    position: relative;
    background: transparent;
    color: transparent; /* скрываем латинский текст */
    caret-color: black; /* курсор виден */
    font-family: NotoSerifCJKtc, serif;
    font-size: 18px;
    padding: 10px;
    height: 150px;
    width: 100%;
    outline: none;
    border: 1px solid #ccc;
    resize: none;
    line-height: 1.4em;
    z-index: 2;
    overflow: auto;
    box-sizing: border-box;
  }
  #ime-input.hide-caret {
    caret-color: transparent !important;
  }
  #preview {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    padding: 10px;
    font-family: NotoSerifCJKtc, serif;
    font-size: 18px;
    line-height: 1.4em;
    white-space: pre-wrap;
    word-wrap: break-word;
    color: black;
    pointer-events: none;
    border: 1px solid transparent;
    overflow-y: auto;
    z-index: 1;
    background: white;
    box-sizing: border-box;
  }

	#candidates { border: 1px solid #ccc; max-width: 400px; margin-top: 5px; cursor: pointer; background: white; }
	#candidates div { padding: 6px 10px; }
	#candidates div:hover, #candidates .selected { background-color: #def; }
	#status { margin-top: 10px; color: #666; font-size: 14px; }

	#output { width: 100%; height: 120px; font-size: 1.2em; white-space: pre-wrap; word-wrap: break-word; padding: 10px; margin-top: 1em; }
  button { margin-top: 1em; padding: 0.5em 1em; font-size: 1em; }

  .underline {
    text-decoration: underline;
  }
</style>

const input = document.getElementById('ime-input');
const preview = document.getElementById('preview');
const candidatesBox = document.getElementById('candidates');
const status = document.getElementById('status');

let composing = ''; // текущий латинский слог
let originalText = ''; // исходный текст до выбора кандидатов
let originalCursor = 0; // позиция курсора в исходном тексте
let previewing = false; // флаг, что сейчас предпросмотр
let previewCandidateChar = ''; // текущий кандидат для предпросмотра
let replaceStart = 0; // позиция в исходном тексте начала заменяемого слога

function escapeHtml(text) {
  return text.replace(/[&<>"'\n\r]/g, function(m) {
    switch (m) {
      case '&': return '&amp;';
      case '<': return '&lt;';
      case '>': return '&gt;';
      case '"': return '&quot;';
      case "'": return '&#39;';
      case '\n': return '<br>';
      case '\r': return '';
      default: return m;
    }
  });
}

function findLongestMatchInput(str) {
  let longestKey = '';
  for (const key in mappingVariants) {
    if (str.endsWith(key)) {
      if (key.length > longestKey.length) {
        longestKey = key;
      }
    }
  }
  return longestKey;
}

function updatePreview() {
  if (previewing && composing && previewCandidateChar) {
    const before = escapeHtml(originalText.slice(0, replaceStart));
    const underlined = escapeHtml(previewCandidateChar);
    const after = escapeHtml(originalText.slice(originalCursor));
    preview.innerHTML = before + `<span class="underline">${underlined}</span>` + after;
    preview.scrollTop = input.scrollTop;
  } else {
    preview.textContent = input.value;
    preview.scrollTop = input.scrollTop;
  }
}

function showCandidates(variants) {
  candidatesBox.innerHTML = '';
  variants.forEach((variant, i) => {
    const div = document.createElement('div');
    div.textContent = variant;
    if (i === 0) div.classList.add('selected');
    div.addEventListener('click', () => {
      chooseCandidate(i);
      input.focus();
    });
    div.addEventListener('mouseenter', () => {
      previewCandidate(i);
    });
    candidatesBox.appendChild(div);
  });

  if (!previewing) {
    originalText = input.value;
    originalCursor = input.selectionStart;
    replaceStart = originalCursor - composing.length;
    previewing = true;
    input.classList.add('hide-caret');
  }

  candidatesBox.style.display = 'block';

  previewCandidate(0);
}

function previewCandidate(index) {
  const matchKey = findLongestMatchInput(composing);
  if (!matchKey) return;

  const variants = mappingVariants[matchKey];
  if (!variants || !variants[index]) return;

  previewCandidateChar = variants[index];
  updatePreview();
  status.textContent = `"${matchKey}"为、${previewCandidateChar} 見`;
}

function chooseCandidate(index) {
  const matchKey = findLongestMatchInput(composing);
  if (!matchKey) return;

  const variants = mappingVariants[matchKey];
  const selected = variants[index];
  if (!selected) return;

  if (!previewing) {
    const fullText = input.value;
    const cursorPos = input.selectionStart;
    const startReplace = cursorPos - composing.length;
    const newText = fullText.slice(0, startReplace) + selected + fullText.slice(cursorPos);

    input.value = newText;
    input.selectionStart = input.selectionEnd = startReplace + selected.length;
  } else {
    const newText = originalText.slice(0, replaceStart) + selected + originalText.slice(originalCursor);

    input.value = newText;
    input.selectionStart = input.selectionEnd = replaceStart + selected.length;
  }

  composing = '';
  previewCandidateChar = '';
  previewing = false;
  candidatesBox.style.display = 'none';
  status.textContent = '';

  input.classList.remove('hide-caret');
  input.focus();
  updatePreview();
}

input.addEventListener('input', () => {
  const cursorPos = input.selectionStart;
  const textBeforeCursor = input.value.slice(0, cursorPos);

  const match = textBeforeCursor.match(/[\w`~\-\.\[\]\,\/]+$/);

  composing = match ? match[0] : '';

  if (composing) {
    const longestMatch = findLongestMatchInput(composing);
    if (longestMatch) {
      const variants = mappingVariants[longestMatch];
      if (variants && variants.length > 0) {
        if (!previewing) {
          originalText = input.value;
          originalCursor = cursorPos;
          replaceStart = originalCursor - composing.length;
          previewing = true;
          input.classList.add('hide-caret');
        }
        showCandidates(variants);
        status.textContent = `Выберите символ для "${longestMatch}"`;
        return;
      }
    }
  }
  candidatesBox.style.display = 'none';
  status.textContent = '';
  previewing = false;
  previewCandidateChar = '';
  input.classList.remove('hide-caret');
  updatePreview();
});

input.addEventListener('scroll', () => {
  preview.scrollTop = input.scrollTop;
});

input.addEventListener('keydown', (e) => {
  if (candidatesBox.style.display === 'block') {
    const selectedDiv = candidatesBox.querySelector('.selected');
    if (!selectedDiv) return;

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Tab') {
      e.preventDefault();
      const items = Array.from(candidatesBox.children);
      let idx = items.indexOf(selectedDiv);
      if (e.key === 'ArrowDown' || e.key === 'Tab') {
        idx = (idx + 1) % items.length;
      } else {
        idx = (idx - 1 + items.length) % items.length;
      }
      selectedDiv.classList.remove('selected');
      items[idx].classList.add('selected');
      previewCandidate(idx);
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const items = Array.from(candidatesBox.children);
      const idx = items.indexOf(selectedDiv);
      chooseCandidate(idx);
    } else if (e.key === 'Escape') {
      e.preventDefault();
      candidatesBox.style.display = 'none';
      composing = '';
      status.textContent = '';
      previewing = false;
      previewCandidateChar = '';
      input.classList.remove('hide-caret');
      updatePreview();
    }
  }
});

//-- Revers
const reverseMap = {};
for (const [latin, chars] of Object.entries(mappingVariants)) {
  for (const ch of chars) {
    if (ch === "") continue;
    if (!(ch in reverseMap)) reverseMap[ch] = latin;
  }
}

function convert() {
  const inputValue = document.getElementById("ime-input").value.trim();
  if (!inputValue) {
    document.getElementById("output").textContent = "";
    return;
  }

  let result = "";
  for (const ch of inputValue) {
    if (reverseMap[ch]) {
      result += reverseMap[ch] + " ";
    } else {
      result += ch;
    }
  }
  
  document.getElementById("output").textContent = result.trim();
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("convert-btn").addEventListener("click", convert);
});
